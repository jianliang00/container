name: macOS native layer metadata diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Inspect layer metadata without starting a VM
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          test "$(xcrun --show-sdk-version | cut -d. -f1)" -ge 27
          xcrun swiftc -target arm64-apple-macosx27.0 scripts/macos-native-overlay-probe/LayerMetadata.swift -o "$RUNNER_TEMP/layer-metadata"
          "$RUNNER_TEMP/layer-metadata"
          rm "$RUNNER_TEMP/layer-metadata"
