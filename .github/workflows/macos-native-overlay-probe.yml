name: macOS native layer metadata diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Inspect layer metadata without starting a VM
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          test "$(xcrun --show-sdk-version | cut -d. -f1)" -ge 27
          xcrun swiftc -target arm64-apple-macosx27.0 scripts/macos-native-overlay-probe/LayerMetadata.swift -o "$RUNNER_TEMP/layer-metadata"
          "$RUNNER_TEMP/layer-metadata"
          rm "$RUNNER_TEMP/layer-metadata"
      - name: Inspect framework linkage for older hosts
        run: |
          set -euo pipefail
          xcrun swiftc -target arm64-apple-macosx15.0 scripts/macos-native-overlay-probe/WeakLink.swift -o "$RUNNER_TEMP/weak-link"
          "$RUNNER_TEMP/weak-link"
          otool -l "$RUNNER_TEMP/weak-link" > "$RUNNER_TEMP/load-commands.txt"
          python3 - <<'PYCODE'
          import os,pathlib
          value=pathlib.Path(os.environ['RUNNER_TEMP'],'load-commands.txt').read_text()
          blocks=[v for v in value.split('Load command ') if 'DiskImageKit.framework/' in v]
          print(''.join(blocks))
          assert len(blocks)==1 and 'LC_LOAD_WEAK_DYLIB' in blocks[0]
          PYCODE
          rm "$RUNNER_TEMP/weak-link" "$RUNNER_TEMP/load-commands.txt"
