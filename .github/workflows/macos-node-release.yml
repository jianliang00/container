name: container project - macOS node release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Canonical container-macos-node release tag to create"
        required: true
        type: string
      kubelet_artifact_url:
        description: "URL of the kubelet-darwin-arm64 tar.gz artifact"
        required: true
        default: "https://github.com/jianliang00/kubernetes/releases/download/kubelet-darwin-arm64-k8s-v1.27.2-7/kubelet-darwin-arm64-k8s-v1.27.2-7.tar.gz"
        type: string
      kubelet_artifact_sha256:
        description: "Expected SHA-256 digest of the kubelet artifact"
        required: true
        default: "44eaf2f738e06a5c0312794f05dc4adad9a33dec133345274dacd323de59016e"
        type: string
      node_name:
        description: "Default node name recorded in the release manifest"
        required: true
        default: "macos-node-1"
        type: string
      draft:
        description: "Create the GitHub release as a draft"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: false
        type: boolean
      skip_notarization:
        description: "Skip Apple notarization and stapling"
        required: true
        default: false
        type: boolean
      prepare_unpaired_draft:
        description: "Create a notarized package-only draft for rebuilding the paired sandbox image"
        required: true
        default: false
        type: boolean
      promote_existing_draft:
        description: "Publish an existing signed and notarized draft after regenerating release metadata"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "container-macos-node-*"

jobs:
  build-sign-notarize-release:
    name: Build, sign, notarize, and publish macOS node installer
    timeout-minutes: 90
    runs-on: macos-26
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: read
    env:
      KUBERNETES_BASELINE: v1.27.2
      DEFAULT_KUBELET_ARTIFACT_URL: "https://github.com/jianliang00/kubernetes/releases/download/kubelet-darwin-arm64-k8s-v1.27.2-7/kubelet-darwin-arm64-k8s-v1.27.2-7.tar.gz"
      DEFAULT_KUBELET_ARTIFACT_SHA256: "44eaf2f738e06a5c0312794f05dc4adad9a33dec133345274dacd323de59016e"
      DEFAULT_NODE_NAME: macos-node-1
      RELEASE_POLICY_PATH: packaging/macos-node/release-policy.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Materialize private release pairing
        env:
          RELEASE_PAIRING_BASE64: ${{ secrets.MACOS_NODE_RELEASE_PAIRING_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "${RELEASE_PAIRING_BASE64}" ]]; then
            echo "::error::MACOS_NODE_RELEASE_PAIRING_BASE64 is required"
            exit 1
          fi

          release_pairing_path="${RUNNER_TEMP}/release-pairing.json"
          umask 077
          python3 -c 'import base64, pathlib, sys; data = "".join(sys.stdin.read().split()); pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(data, validate=True))' \
            "${release_pairing_path}" <<< "${RELEASE_PAIRING_BASE64}"
          echo "RELEASE_PAIRING_PATH=${release_pairing_path}" >> "$GITHUB_ENV"

      - name: Validate release pairing
        run: |
          set -euo pipefail
          jq -e '
            .schemaVersion == 1
              and (.guestAgent.requiredCapabilities | type == "array" and length > 0)
              and (.guestAgent.requiredCapabilities | all(type == "string" and test("^[A-Za-z0-9._-]+$")))
              and .deploymentPairing.required == true
              and .deploymentPairing.digestAlgorithm == "sha256"
          ' "${RELEASE_POLICY_PATH}" >/dev/null
          jq -e '
            def digest: type == "string" and test("^sha256:[0-9a-f]{64}$");
            def sha256: type == "string" and test("^[0-9a-f]{64}$");
            def repository: type == "string" and test("^[A-Za-z0-9._:-]+(/[A-Za-z0-9._-]+)+$");
            def image: type == "string" and test("^[A-Za-z0-9._:-]+(/[A-Za-z0-9._-]+)+@sha256:[0-9a-f]{64}$");
            .schemaVersion == 1
              and (.sandboxImage as $sandbox
                | ($sandbox.indexDigest | digest)
                and ($sandbox.darwinArm64ManifestDigest | digest)
                and ($sandbox.configDigest | digest)
                and ($sandbox.auxiliaryStorageDigest | digest)
                and ($sandbox.repository | repository)
                and ($sandbox.tag | type == "string" and test("^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$"))
                and ($sandbox.reference == ($sandbox.repository + ":" + $sandbox.tag + "@" + $sandbox.indexDigest))
                and ($sandbox.source.containerCommit | test("^[0-9a-f]{40}$"))
                and ($sandbox.source.dockerfile | type == "string" and test("^[A-Za-z0-9._/-]+$"))
                and ($sandbox.source.baseImage | image)
                and ($sandbox.guestAgent.sha256 | sha256)
                and ($sandbox.guestAgent.requiredCapabilities | type == "array" and length > 0)
                and ($sandbox.guestAgent.requiredCapabilities | all(type == "string" and test("^[A-Za-z0-9._-]+$"))))
              and (.workloadImage as $workload
                | ($workload.indexDigest | digest)
                and ($workload.darwinArm64ManifestDigest | digest)
                and ($workload.reference | image)
                and ($workload.reference == (($workload.reference | split("@")[0]) + "@" + $workload.indexDigest)))
          ' "${RELEASE_PAIRING_PATH}" >/dev/null

          private_capabilities="$(jq -cS '.sandboxImage.guestAgent.requiredCapabilities' "${RELEASE_PAIRING_PATH}")"
          public_capabilities="$(jq -cS '.guestAgent.requiredCapabilities' "${RELEASE_POLICY_PATH}")"
          if [[ "${private_capabilities}" != "${public_capabilities}" ]]; then
            echo "::error::Private release pairing capabilities do not match the public release policy"
            exit 1
          fi

          while IFS= read -r sensitive_value; do
            if [[ -n "${sensitive_value}" ]]; then
              echo "::add-mask::${sensitive_value}"
            fi
          done < <(jq -r '[
            .sandboxImage.repository,
            .sandboxImage.tag,
            .sandboxImage.reference,
            .sandboxImage.source.baseImage,
            .workloadImage.reference
          ] | .[]' "${RELEASE_PAIRING_PATH}")

          deployment_pairing_sha256="$(shasum -a 256 "${RELEASE_PAIRING_PATH}" | awk '{print $1}')"
          required_capabilities="$(jq -r '.guestAgent.requiredCapabilities | join(", ")' "${RELEASE_POLICY_PATH}")"
          {
            echo "DEPLOYMENT_PAIRING_SHA256=${deployment_pairing_sha256}"
            echo "REQUIRED_GUEST_CAPABILITIES=${required_capabilities}"
          } >> "$GITHUB_ENV"

      - name: Resolve release inputs
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_KUBELET_ARTIFACT_URL: ${{ inputs.kubelet_artifact_url }}
          INPUT_KUBELET_ARTIFACT_SHA256: ${{ inputs.kubelet_artifact_sha256 }}
          INPUT_NODE_NAME: ${{ inputs.node_name }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_SKIP_NOTARIZATION: ${{ inputs.skip_notarization }}
          INPUT_PREPARE_UNPAIRED_DRAFT: ${{ inputs.prepare_unpaired_draft }}
          INPUT_PROMOTE_EXISTING_DRAFT: ${{ inputs.promote_existing_draft }}
        run: |
          set -euo pipefail

          release_tag="${GITHUB_REF_NAME}"
          kubelet_artifact_url="${DEFAULT_KUBELET_ARTIFACT_URL}"
          kubelet_artifact_sha256="${DEFAULT_KUBELET_ARTIFACT_SHA256}"
          node_name="${DEFAULT_NODE_NAME}"
          draft="false"
          prerelease="false"
          skip_notarization="false"
          prepare_unpaired_draft="false"
          promote_existing_draft="false"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${INPUT_RELEASE_TAG}"
            kubelet_artifact_url="${INPUT_KUBELET_ARTIFACT_URL}"
            kubelet_artifact_sha256="${INPUT_KUBELET_ARTIFACT_SHA256}"
            node_name="${INPUT_NODE_NAME}"
            draft="${INPUT_DRAFT}"
            prerelease="${INPUT_PRERELEASE}"
            skip_notarization="${INPUT_SKIP_NOTARIZATION}"
            prepare_unpaired_draft="${INPUT_PREPARE_UNPAIRED_DRAFT}"
            promote_existing_draft="${INPUT_PROMOTE_EXISTING_DRAFT}"
          fi

          release_tag_pattern='^container-macos-node-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-(0|[1-9][0-9]*)-g([0-9a-f]{7})-k8s-v1\.27\.2$'
          if [[ ! "${release_tag}" =~ ${release_tag_pattern} ]]; then
            echo "::error::release_tag must match container-macos-node-<semver>-<sequence>-g<sha7>-k8s-v1.27.2"
            exit 1
          fi
          tag_major="${BASH_REMATCH[1]}"
          tag_minor="${BASH_REMATCH[2]}"
          tag_patch="${BASH_REMATCH[3]}"
          tag_sequence="${BASH_REMATCH[4]}"
          tag_short_sha="${BASH_REMATCH[5]}"
          if [[ ! "${kubelet_artifact_url}" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::kubelet_artifact_url must be an HTTPS URL without whitespace"
            exit 1
          fi
          if [[ ! "${node_name}" =~ ^([a-z0-9]|[a-z0-9][a-z0-9.-]{0,251}[a-z0-9])$ ]]; then
            echo "::error::node_name must be a lowercase Kubernetes DNS subdomain"
            exit 1
          fi
          for boolean_value in "${draft}" "${prerelease}" "${skip_notarization}" "${prepare_unpaired_draft}" "${promote_existing_draft}"; do
            if [[ "${boolean_value}" != "true" && "${boolean_value}" != "false" ]]; then
              echo "::error::draft, prerelease, skip_notarization, prepare_unpaired_draft, and promote_existing_draft must be boolean values"
              exit 1
            fi
          done
          if [[ "${skip_notarization}" == "true" && "${draft}" != "true" ]]; then
            echo "::error::skip_notarization requires draft=true"
            exit 1
          fi
          if [[ "${prepare_unpaired_draft}" == "true" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
              echo "::error::prepare_unpaired_draft is only supported with workflow_dispatch"
              exit 1
            fi
            if [[ "${draft}" != "true" || "${prerelease}" != "false" || "${skip_notarization}" != "false" || "${promote_existing_draft}" != "false" ]]; then
              echo "::error::prepare_unpaired_draft requires draft=true, prerelease=false, skip_notarization=false, and promote_existing_draft=false"
              exit 1
            fi
          fi
          if [[ "${promote_existing_draft}" == "true" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
              echo "::error::promote_existing_draft is only supported with workflow_dispatch"
              exit 1
            fi
            if [[ "${draft}" != "false" || "${prerelease}" != "false" || "${skip_notarization}" != "false" ]]; then
              echo "::error::promote_existing_draft requires draft=false, prerelease=false, and skip_notarization=false"
              exit 1
            fi
          else
            expected_short_sha="${GITHUB_SHA:0:7}"
            if [[ "${tag_short_sha}" != "${expected_short_sha}" ]]; then
              echo "::error::release_tag embeds commit ${tag_short_sha}, expected ${expected_short_sha} from GITHUB_SHA"
              exit 1
            fi
            if existing_tag_commit="$(git rev-parse --verify --quiet "refs/tags/${release_tag}^{commit}")"; then
              if [[ "${existing_tag_commit}" != "${GITHUB_SHA}" ]]; then
                echo "::error::Existing tag ${release_tag} points to ${existing_tag_commit}, not ${GITHUB_SHA}"
                exit 1
              fi
            fi
          fi

          package_version="${tag_major}.${tag_minor}.${tag_patch}-${tag_sequence}-g${tag_short_sha}"

          package_name="container-macos-node-${package_version}-k8s-${KUBERNETES_BASELINE}.pkg"
          package_path="bin/release/${package_name}"
          kubelet_artifact_path="${RUNNER_TEMP}/kubelet-artifact.tar.gz"

          sandbox_guest_agent_sha256="$(jq -er '.sandboxImage.guestAgent.sha256' "${RELEASE_PAIRING_PATH}")"

          if [[ ! "${kubelet_artifact_sha256}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::kubelet_artifact_sha256 must contain exactly 64 hexadecimal characters"
            exit 1
          fi
          kubelet_artifact_sha256="$(printf '%s' "${kubelet_artifact_sha256}" | tr '[:upper:]' '[:lower:]')"

          {
            echo "RELEASE_TAG=${release_tag}"
            echo "PACKAGE_VERSION=${package_version}"
            echo "PACKAGE_NAME=${package_name}"
            echo "PACKAGE_PATH=${package_path}"
            echo "KUBELET_ARTIFACT_URL=${kubelet_artifact_url}"
            echo "KUBELET_ARTIFACT_PATH=${kubelet_artifact_path}"
            echo "KUBELET_ARTIFACT_SHA256=${kubelet_artifact_sha256}"
            echo "MACOS_NODE_NAME=${node_name}"
            echo "SANDBOX_GUEST_AGENT_SHA256=${sandbox_guest_agent_sha256}"
            echo "RELEASE_MANIFEST_PATH=${RUNNER_TEMP}/container-macos-node-release-manifest.json"
            echo "PACKAGE_SBOM_ROOT=${RUNNER_TEMP}/container-macos-node-sbom-root"
            echo "PACKAGE_SBOM_PATH=${RUNNER_TEMP}/container-macos-node-sbom.spdx.json"
            echo "PACKAGE_RELEASE_PREDICATE_PATH=${RUNNER_TEMP}/container-macos-node-package-release-predicate.json"
            echo "PACKAGE_RELEASE_ATTESTATION_PATH=${RUNNER_TEMP}/container-macos-node-package-release-attestation.json"
            echo "PACKAGE_SBOM_ATTESTATION_PATH=${RUNNER_TEMP}/container-macos-node-package-sbom-attestation.json"
            echo "RELEASE_MANIFEST_ATTESTATION_PATH=${RUNNER_TEMP}/container-macos-node-release-manifest-attestation.json"
            echo "RELEASE_DRAFT=${draft}"
            echo "RELEASE_PRERELEASE=${prerelease}"
            echo "SKIP_NOTARIZATION=${skip_notarization}"
            echo "PREPARE_UNPAIRED_DRAFT=${prepare_unpaired_draft}"
            echo "PROMOTE_EXISTING_DRAFT=${promote_existing_draft}"
          } >> "$GITHUB_ENV"

      - name: Resolve GitHub release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${PROMOTE_EXISTING_DRAFT}" == "true" ]]; then
            release_json="$(gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json isDraft,targetCommitish,assets)"
            if ! jq -e '.isDraft == true' <<< "${release_json}" >/dev/null; then
              echo "::error::Release ${RELEASE_TAG} must exist as a draft before promotion"
              exit 1
            fi

            container_commit="$(jq -er '.targetCommitish' <<< "${release_json}")"
            if [[ ! "${container_commit}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Draft targetCommitish must be a full commit SHA"
              exit 1
            fi
            if [[ "${container_commit:0:7}" != "${PACKAGE_VERSION##*-g}" ]]; then
              echo "::error::Draft target ${container_commit} does not match ${RELEASE_TAG}"
              exit 1
            fi
            jq -e \
              --arg package_name "${PACKAGE_NAME}" \
              --arg checksum_name "${PACKAGE_NAME}.sha256" \
              '([.assets[] | select(.name == $package_name)] | length) == 1
                and ([.assets[] | select(.name == $checksum_name)] | length) == 1' \
              <<< "${release_json}" >/dev/null
          else
            if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "::error::Release ${RELEASE_TAG} already exists; refusing to rebuild or replace published assets"
              exit 1
            fi
            container_commit="${GITHUB_SHA}"
          fi

          paired_container_commit="$(jq -er '.sandboxImage.source.containerCommit' "${RELEASE_PAIRING_PATH}")"
          git cat-file -e "${container_commit}^{commit}"
          git cat-file -e "${paired_container_commit}^{commit}"
          if ! git merge-base --is-ancestor "${paired_container_commit}" "${container_commit}"; then
            echo "::error::Release pairing source commit ${paired_container_commit} is not an ancestor of release commit ${container_commit}"
            exit 1
          fi

          echo "CONTAINER_COMMIT=${container_commit}" >> "$GITHUB_ENV"

      - name: Run source quality gates
        run: |
          set -euo pipefail

          make swift-fmt-check
          git diff --check
          bash -n scripts/macos-node-installer/build.sh
          plutil -lint packaging/macos-node/launchd/*.plist
          for config_path in packaging/macos-node/config/*.json packaging/macos-node/config/*.conf packaging/macos-node/config/*.conflist; do
            jq -e . "${config_path}" >/dev/null
          done
          plutil -extract ProgramArguments json -o - \
            packaging/macos-node/launchd/com.apple.container.kubelet.plist | \
            jq -e '
              index("--node-labels") as $index
              | .[$index + 1] == "kubernetes.io/os=darwin,node.kubernetes.io/macos=true,node.kubernetes.io/macos-network=full"
            ' >/dev/null
          ruby -ryaml <<'RUBY'
          documents = YAML.load_stream(File.read("packaging/macos-node/manifests/macos-node-bootstrap-rbac.yaml"))

          role = lambda do |rules|
            { "apiVersion" => "rbac.authorization.k8s.io/v1", "rules" => rules }
          end
          binding = lambda do |role_ref, subjects|
            { "apiVersion" => "rbac.authorization.k8s.io/v1", "roleRef" => role_ref, "subjects" => subjects }
          end
          service_account = lambda do |name|
            { "kind" => "ServiceAccount", "name" => name, "namespace" => "kube-system" }
          end
          cluster_role_ref = lambda do |name|
            { "apiGroup" => "rbac.authorization.k8s.io", "kind" => "ClusterRole", "name" => name }
          end
          role_ref = lambda do |name|
            { "apiGroup" => "rbac.authorization.k8s.io", "kind" => "Role", "name" => name }
          end

          expected_objects = {
            ["ServiceAccount", "kube-system", "kube-proxy-macos"] => { "apiVersion" => "v1" },
            ["ServiceAccount", "kube-system", "flannel-macos"] => { "apiVersion" => "v1" },
            ["Role", "kube-system", "container:kube-proxy-macos-token-renewal"] => role.call([
              { "apiGroups" => [""], "resources" => ["serviceaccounts/token"], "resourceNames" => ["kube-proxy-macos"], "verbs" => ["create"] },
            ]),
            ["RoleBinding", "kube-system", "container:kube-proxy-macos-token-renewal"] => binding.call(
              role_ref.call("container:kube-proxy-macos-token-renewal"),
              [service_account.call("kube-proxy-macos")]
            ),
            ["Role", "kube-system", "container:flannel-macos-token-renewal"] => role.call([
              { "apiGroups" => [""], "resources" => ["serviceaccounts/token"], "resourceNames" => ["flannel-macos"], "verbs" => ["create"] },
            ]),
            ["RoleBinding", "kube-system", "container:flannel-macos-token-renewal"] => binding.call(
              role_ref.call("container:flannel-macos-token-renewal"),
              [service_account.call("flannel-macos")]
            ),
            ["ClusterRole", nil, "container:kube-proxy-macos"] => role.call([
              { "apiGroups" => [""], "resources" => ["services"], "verbs" => ["list"] },
              { "apiGroups" => ["discovery.k8s.io"], "resources" => ["endpointslices"], "verbs" => ["list"] },
            ]),
            ["ClusterRoleBinding", nil, "container:kube-proxy-macos-read"] => binding.call(
              cluster_role_ref.call("container:kube-proxy-macos"),
              [service_account.call("kube-proxy-macos")]
            ),
            ["ClusterRole", nil, "container:flannel-macos"] => role.call([
              { "apiGroups" => [""], "resources" => ["nodes"], "verbs" => ["get", "list"] },
            ]),
            ["ClusterRoleBinding", nil, "container:flannel-macos"] => binding.call(
              cluster_role_ref.call("container:flannel-macos"),
              [service_account.call("flannel-macos")]
            ),
            ["Role", "kube-flannel", "container:flannel-macos-config"] => role.call([
              { "apiGroups" => [""], "resources" => ["configmaps"], "resourceNames" => ["kube-flannel-cfg"], "verbs" => ["get"] },
            ]),
            ["RoleBinding", "kube-flannel", "container:flannel-macos-config"] => binding.call(
              role_ref.call("container:flannel-macos-config"),
              [service_account.call("flannel-macos")]
            ),
            ["Role", "kube-system", "container:macos-node-bootstrap"] => role.call([
              { "apiGroups" => [""], "resources" => ["configmaps"], "resourceNames" => ["kubelet-config"], "verbs" => ["get"] },
              { "apiGroups" => [""], "resources" => ["serviceaccounts/token"], "resourceNames" => ["kube-proxy-macos", "flannel-macos"], "verbs" => ["create"] },
            ]),
            ["RoleBinding", "kube-system", "container:macos-node-bootstrap"] => binding.call(
              role_ref.call("container:macos-node-bootstrap"),
              [{ "kind" => "Group", "name" => "system:bootstrappers:kubeadm:default-node-token", "apiGroup" => "rbac.authorization.k8s.io" }]
            ),
          }

          actual_objects = documents.compact.to_h do |document|
            [[document["kind"], document.dig("metadata", "namespace"), document.dig("metadata", "name")], document]
          end
          abort "RBAC manifest must contain exactly 14 unique objects" unless documents.compact.length == 14 && actual_objects.length == 14
          abort "unexpected RBAC object set" unless actual_objects.keys.sort_by(&:inspect) == expected_objects.keys.sort_by(&:inspect)

          expected_objects.each do |key, expected|
            document = actual_objects.fetch(key)
            expected_metadata = { "name" => key[2] }
            expected_metadata["namespace"] = key[1] if key[1]
            abort "unexpected metadata for #{key.inspect}" unless document["metadata"] == expected_metadata
            expected_document = { "apiVersion" => expected.fetch("apiVersion"), "kind" => key[0], "metadata" => expected_metadata }
            expected_document["rules"] = expected["rules"] if expected.key?("rules")
            expected_document["roleRef"] = expected["roleRef"] if expected.key?("roleRef")
            expected_document["subjects"] = expected["subjects"] if expected.key?("subjects")
            abort "unexpected RBAC object #{key.inspect}: #{document.inspect}" unless document == expected_document
          end

          abort "wildcard RBAC grant must not be declared" if documents.compact.any? do |document|
            document.fetch("rules", []).any? do |rule|
              %w[apiGroups resources verbs resourceNames nonResourceURLs].any? { |field| Array(rule[field]).include?("*") }
            end
          end

          build_script = File.read("scripts/macos-node-installer/build.sh")
          release_workflow = YAML.load_file(".github/workflows/macos-node-release.yml")
          verify_step = release_workflow
            .fetch("jobs")
            .fetch("build-sign-notarize-release")
            .fetch("steps")
            .find { |step| step["name"] == "Verify signed installer package" }
          abort "missing installer verification step" unless verify_step
          signed_array = verify_step.fetch("run").match(/signed_payload_binaries=\((.*?)\n\s*\)/m)
          abort "missing signed payload verification list" unless signed_array
          build_staged_paths = build_script.scan(
            /stage_file "(?:\$\{BUILD_BIN_DIR\}\/[^\"]+|\$KUBELET_BINARY)" "\$\{PKGROOT\}\/([^\"]+)" 0755/
          ).flatten.sort
          build_signed_paths = build_script.scan(/codesign_path "\$\{PKGROOT\}\/([^\"]+)"/).flatten.sort
          verified_paths = signed_array[1].scan(/"([^"]+)"/).flatten.sort
          [build_staged_paths, build_signed_paths, verified_paths].each do |paths|
            abort "installer must contain exactly 20 unique signed Mach-O payload paths" unless paths.length == 20 && paths.uniq.length == 20
          end
          abort "installer staging, signing, and verification path lists differ" unless build_staged_paths == build_signed_paths && build_signed_paths == verified_paths
          RUBY
          xcrun clang \
            -std=c11 \
            -Wall \
            -Wextra \
            -Werror \
            -I Sources/CContainerK8sFlannelVXLANMacOS/include \
            -fsyntax-only \
            Sources/CContainerK8sFlannelVXLANMacOS/ContainerK8sFlannelVXLANMacOS.c

      - name: Build release package and run macOS networking tests
        if: env.PROMOTE_EXISTING_DRAFT != 'true'
        run: |
          set -euo pipefail

          RELEASE_VERSION="${PACKAGE_VERSION}" \
            GIT_COMMIT="$(git rev-parse HEAD)" \
            /usr/bin/swift build --skip-update -c release

          test_filter='^('
          test_filter+='ContainerCRIShimMacOSTests\.(CRIShimConfigTests|CRIShimPodNetworkStateTests)'
          test_filter+='|ContainerCRIShimMacOSTests\.CRIShimCoreMappingTests/embedsSandboxMetadataInCoreLabelsForStartupReconcile\(\)'
          test_filter+='|ContainerCRIShimMacOSTests\.CRIShimRuntimeServerTests/(grpcServerServesVersionOnUnixDomainSocket|updateRuntimeConfigIgnoresPodCIDRsWhenPodNetworkingIsDisabled)\(\)'
          test_filter+='|ContainerK8sFlannelVXLANMacOSTests\.'
          test_filter+='|ContainerK8sKubeProxyMacOSTests\.'
          test_filter+='|ContainerMacOSNodeStatusTests\.'
          test_filter+='|ContainerMacOSKubeadmTests\.'
          test_filter+='|VMNetRecoveryMacOSTests\.'
          test_filter+='|ContainerOSTests\.DirectoryWatcherTest'
          test_filter+='|ContainerResourceTests\.ContainerConfigurationMacOSTests'
          test_filter+='|MacOSGuestAgentTests\.GuestDNSProxyTests'
          test_filter+='|MacOSGuestAgentTests\.GuestNetworkConfiguratorTests'
          test_filter+='|RuntimeMacOSSidecarClientTests\.MacOSSandboxServiceNetworkTests'
          test_filter+='|RuntimeMacOSSidecarSharedTests\.SidecarGuestNetworkingProtocolTests'
          test_filter+='|RuntimeMacOSSidecarTests\.MacOSGuestNetworkBootstrapTests'
          test_filter+=')'
          /usr/bin/swift test --skip-update --filter "${test_filter}"

      - name: Download and verify kubelet artifact
        run: |
          set -euo pipefail

          curl --fail --location --retry 5 --retry-delay 5 \
            --output "${KUBELET_ARTIFACT_PATH}" \
            "${KUBELET_ARTIFACT_URL}"
          actual_sha256="$(shasum -a 256 "${KUBELET_ARTIFACT_PATH}" | awk '{print $1}')"
          if [[ "${actual_sha256}" != "${KUBELET_ARTIFACT_SHA256}" ]]; then
            echo "::error::Kubelet artifact SHA-256 mismatch: expected ${KUBELET_ARTIFACT_SHA256}, got ${actual_sha256}"
            exit 1
          fi
          echo "Verified kubelet artifact SHA-256: ${actual_sha256}"

      - name: Download existing draft package
        if: env.PROMOTE_EXISTING_DRAFT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          package_directory="$(dirname "${PACKAGE_PATH}")"
          package_basename="$(basename "${PACKAGE_PATH}")"
          mkdir -p "${package_directory}"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${package_basename}" \
            --pattern "${package_basename}.sha256" \
            --dir "${package_directory}"
          (
            cd "${package_directory}"
            shasum -a 256 --check "${package_basename}.sha256"
          )

      - name: Validate signing and notarization secrets
        if: env.PROMOTE_EXISTING_DRAFT != 'true'
        env:
          APP_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64 }}
          APP_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          APP_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
          INSTALLER_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_P12_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD }}
          INSTALLER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_IDENTITY }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          required_values=(
            APP_CERTIFICATE
            APP_CERTIFICATE_PASSWORD
            APP_IDENTITY
            INSTALLER_CERTIFICATE
            INSTALLER_CERTIFICATE_PASSWORD
            INSTALLER_IDENTITY
          )
          if [[ "${SKIP_NOTARIZATION}" != "true" ]]; then
            required_values+=(
              APP_STORE_CONNECT_API_KEY
              APP_STORE_CONNECT_API_KEY_ID
              APP_STORE_CONNECT_API_ISSUER_ID
            )
          fi

          for value_name in "${required_values[@]}"; do
            if [[ -z "${!value_name}" ]]; then
              echo "::error::Missing required secret ${value_name}"
              exit 1
            fi
          done

      - name: Import Apple Developer ID certificates
        if: env.PROMOTE_EXISTING_DRAFT != 'true'
        env:
          APP_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64 }}
          APP_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          APP_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
          INSTALLER_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_P12_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD }}
          INSTALLER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_IDENTITY }}
        run: |
          set -euo pipefail

          keychain_path="${RUNNER_TEMP}/container-macos-node-release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          app_certificate_path="${RUNNER_TEMP}/developer-id-application.p12"
          installer_certificate_path="${RUNNER_TEMP}/developer-id-installer.p12"

          python3 -c 'import base64, pathlib, sys; pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(sys.stdin.read()))' "${app_certificate_path}" <<< "${APP_CERTIFICATE}"
          python3 -c 'import base64, pathlib, sys; pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(sys.stdin.read()))' "${installer_certificate_path}" <<< "${INSTALLER_CERTIFICATE}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -d user -s "${keychain_path}"

          security import "${app_certificate_path}" -k "${keychain_path}" -P "${APP_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/xcrun
          security import "${installer_certificate_path}" -k "${keychain_path}" -P "${INSTALLER_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/xcrun
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain_path}"
          security find-identity -v -p codesigning "${keychain_path}"
          security find-identity -v -p basic "${keychain_path}"

          {
            echo "CODESIGN_IDENTITY=${APP_IDENTITY}"
            echo "CODESIGN_TIMESTAMP_OPTS=--timestamp"
            echo "CODESIGN_EXTRA_OPTS=--options runtime"
            echo "CODESIGN_KEYCHAIN=${keychain_path}"
            echo "PKG_SIGN_IDENTITY=${INSTALLER_IDENTITY}"
            echo "PKG_SIGN_TIMESTAMP_OPTS=--timestamp"
            echo "PKG_SIGN_KEYCHAIN=${keychain_path}"
          } >> "$GITHUB_ENV"

      - name: Build signed macOS node installer
        if: env.PROMOTE_EXISTING_DRAFT != 'true'
        run: |
          set -euo pipefail
          KUBELET_ARTIFACT_SHA256="${KUBELET_ARTIFACT_SHA256}" \
            make macos-node-installer-pkg \
            BUILD_CONFIGURATION=release \
            RELEASE_VERSION="${PACKAGE_VERSION}" \
            MACOS_NODE_KUBELET_ARTIFACT="${KUBELET_ARTIFACT_PATH}" \
            MACOS_NODE_NAME="${MACOS_NODE_NAME}" \
            MACOS_NODE_SKIP_BUILD=true \
            MACOS_NODE_PKG_PATH="${PACKAGE_PATH}"

      - name: Verify signed installer package
        run: |
          set -euo pipefail
          pkgutil --check-signature "${PACKAGE_PATH}"
          if [[ "${PROMOTE_EXISTING_DRAFT}" == "true" ]]; then
            xcrun stapler validate "${PACKAGE_PATH}"
            spctl -a -vv --type install "${PACKAGE_PATH}"
          fi

          work_dir="$(mktemp -d)"
          trap 'rm -rf "${work_dir}"' EXIT
          pkgutil --expand-full "${PACKAGE_PATH}" "${work_dir}/pkg"

          signed_payload_binaries=(
            "usr/local/bin/container"
            "usr/local/bin/container-apiserver"
            "usr/local/bin/container-cri-shim-macos"
            "usr/local/bin/container-vmnet-recovery-macos"
            "usr/local/bin/container-cni-macvmnet"
            "opt/cni/bin/container-cni-macvmnet"
            "usr/local/bin/container-flannel-vxlan-macos"
            "usr/local/bin/container-kube-proxy-macos"
            "usr/local/bin/container-macos-node-status"
            "usr/local/bin/container-k8s-networkpolicy-macos"
            "usr/local/bin/container-macos-kubeadm"
            "usr/local/bin/kubelet"
            "usr/local/libexec/container/plugins/container-runtime-macos/bin/container-runtime-macos"
            "usr/local/libexec/container/plugins/container-runtime-macos/bin/container-runtime-macos-sidecar"
            "usr/local/libexec/container/plugins/container-network-vmnet/bin/container-network-vmnet"
            "usr/local/libexec/container/plugins/container-core-images/bin/container-core-images"
            "usr/local/libexec/container/plugins/machine-apiserver/bin/machine-apiserver"
            "usr/local/libexec/container/macos-guest-agent/bin/container-macos-guest-agent"
            "usr/local/libexec/container/macos-image-prepare/bin/container-macos-image-prepare"
            "usr/local/libexec/container/macos-vm-manager/bin/container-macos-vm-manager"
          )

          required_payload_paths=(
            "${signed_payload_binaries[@]}"
            "usr/local/share/container-macos-node/templates/config/kubelet-config.yaml"
            "usr/local/share/container-macos-node/templates/config/container-cri-shim-macos-config.json"
            "usr/local/share/container-macos-node/templates/config/container-cni-macvmnet.conflist"
            "usr/local/share/container-macos-node/templates/config/flannel-vxlan-macos.conf"
            "usr/local/share/container-macos-node/templates/config/kube-proxy.conf"
            "usr/local/share/container-macos-node/templates/launchd/com.apple.container.kubelet.plist"
            "usr/local/share/container-macos-node/templates/launchd/com.apple.container.cri-shim-macos.plist"
            "usr/local/share/container-macos-node/templates/launchd/com.apple.container.vmnet-recovery-macos.plist"
            "usr/local/share/container-macos-node/templates/launchd/com.apple.container.flannel-vxlan-macos.plist"
            "usr/local/share/container-macos-node/templates/launchd/com.apple.container.kube-proxy-macos.plist"
            "usr/local/libexec/container/plugins/machine-apiserver/config.toml"
            "usr/local/libexec/container/plugins/machine-apiserver/resources/init"
            "usr/local/libexec/container/plugins/machine-apiserver/resources/create-user.sh"
            "usr/local/libexec/container/macos-guest-agent/share/install.sh"
            "usr/local/libexec/container/macos-guest-agent/share/install-in-guest-from-seed.sh"
            "usr/local/libexec/container/macos-guest-agent/share/container-macos-guest-agent.plist"
            "usr/local/share/container-macos-node/manifests/runtimeclass-macos.yaml"
            "usr/local/share/container-macos-node/manifests/runtimeclass-macos-compat.yaml"
            "usr/local/share/container-macos-node/manifests/macos-node-bootstrap-rbac.yaml"
            "usr/local/share/container-macos-node/release-manifest.json"
          )

          for payload_path in "${required_payload_paths[@]}"; do
            test -e "${work_dir}/pkg/Payload/${payload_path}"
          done

          forbidden_payload_paths=(
            "etc/kubernetes/kubelet-config.yaml"
            "etc/kubernetes/container-cri-shim-macos-config.json"
            "etc/kubernetes/container-macos-node-status.json"
            "etc/kubernetes/flannel-vxlan-macos.conf"
            "etc/kubernetes/kube-proxy.conf"
            "etc/cni/net.d/10-macvmnet.conflist"
            "Library/LaunchDaemons/com.apple.container.kubelet.plist"
            "Library/LaunchDaemons/com.apple.container.cri-shim-macos.plist"
            "Library/LaunchDaemons/com.apple.container.vmnet-recovery-macos.plist"
            "Library/LaunchDaemons/com.apple.container.flannel-vxlan-macos.plist"
            "Library/LaunchDaemons/com.apple.container.kube-proxy-macos.plist"
          )

          for payload_path in "${forbidden_payload_paths[@]}"; do
            test ! -e "${work_dir}/pkg/Payload/${payload_path}"
          done

          release_manifest_path="${work_dir}/pkg/Payload/usr/local/share/container-macos-node/release-manifest.json"
          jq -e \
            --arg package_version "${PACKAGE_VERSION}" \
            --arg kubernetes_baseline "${KUBERNETES_BASELINE}" \
            --arg node_name "${MACOS_NODE_NAME}" \
            --arg container_commit "${CONTAINER_COMMIT}" \
            --arg kubelet_sha256 "${KUBELET_ARTIFACT_SHA256}" \
            '.package == "container-macos-node"
              and .packageVersion == $package_version
              and .kubernetesBaseline == $kubernetes_baseline
              and .nodeName == $node_name
              and .containerCommit == $container_commit
              and .kubeletArtifactSHA256 == $kubelet_sha256' \
            "${release_manifest_path}" >/dev/null

          guest_agent_path="${work_dir}/pkg/Payload/usr/local/libexec/container/macos-guest-agent/bin/container-macos-guest-agent"
          package_guest_agent_sha256="$(shasum -a 256 "${guest_agent_path}" | awk '{print $1}')"
          if [[ "${package_guest_agent_sha256}" != "${SANDBOX_GUEST_AGENT_SHA256}" ]]; then
            if [[ "${PREPARE_UNPAIRED_DRAFT}" != "true" ]]; then
              echo "package and sandbox guest-agent SHA-256 differ: package=${package_guest_agent_sha256} sandbox=${SANDBOX_GUEST_AGENT_SHA256}" >&2
              exit 1
            fi
            echo "::warning::Package guest-agent ${package_guest_agent_sha256} is not paired with the current sandbox ${SANDBOX_GUEST_AGENT_SHA256}; creating a package-only draft"
          fi
          while IFS= read -r capability; do
            if ! grep -a -F -q "${capability}" "${guest_agent_path}"; then
              echo "package guest agent does not contain required capability ${capability}" >&2
              exit 1
            fi
          done < <(jq -r '.sandboxImage.guestAgent.requiredCapabilities[]' "${RELEASE_PAIRING_PATH}")
          echo "PACKAGE_GUEST_AGENT_SHA256=${package_guest_agent_sha256}" >> "$GITHUB_ENV"

          kubelet_path="${work_dir}/pkg/Payload/usr/local/bin/kubelet"

          kubelet_version="$("${kubelet_path}" --version)"
          echo "${kubelet_version}"
          expected_kubelet_version="Kubernetes ${KUBERNETES_BASELINE}"
          if [[ "${kubelet_version}" != "${expected_kubelet_version}" ]]; then
            echo "unexpected kubelet version: ${kubelet_version}; expected ${expected_kubelet_version}" >&2
            exit 1
          fi

          for binary_path in "${signed_payload_binaries[@]}"; do
            payload_binary="${work_dir}/pkg/Payload/${binary_path}"
            payload_file_type="$(file -b "${payload_binary}")"
            if [[ "${payload_file_type}" != *"Mach-O"* ]]; then
              echo "${binary_path} is not a Mach-O executable: ${payload_file_type}" >&2
              exit 1
            fi
            if ! lipo "${payload_binary}" -verify_arch arm64; then
              echo "${binary_path} does not contain an arm64 Mach-O slice" >&2
              exit 1
            fi
            codesign --verify --strict --verbose=2 "${payload_binary}"
            codesign -dv --verbose=2 "${payload_binary}" 2>&1 | grep "Authority=Developer ID Application"
          done

      - name: Notarize and staple installer package
        if: env.PROMOTE_EXISTING_DRAFT != 'true' && env.SKIP_NOTARIZATION != 'true'
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          api_key_path="${RUNNER_TEMP}/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          python3 -c 'import base64, pathlib, sys; pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(sys.stdin.read()))' "${api_key_path}" <<< "${APP_STORE_CONNECT_API_KEY}"

          notary_auth=(
            --key "${api_key_path}"
            --key-id "${APP_STORE_CONNECT_API_KEY_ID}"
            --issuer "${APP_STORE_CONNECT_API_ISSUER_ID}"
          )

          submit_output="${RUNNER_TEMP}/notary-submit.json"
          xcrun notarytool submit "${PACKAGE_PATH}" \
            "${notary_auth[@]}" \
            --output-format json \
            --no-progress > "${submit_output}"

          submission_id="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["id"])' "${submit_output}")"
          echo "Notary submission id: ${submission_id}"

          status=""
          for attempt in {1..90}; do
            info_output="${RUNNER_TEMP}/notary-info-${attempt}.json"
            if xcrun notarytool info "${submission_id}" "${notary_auth[@]}" --output-format json > "${info_output}"; then
              status="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("status", ""))' "${info_output}")"
              echo "Notary status attempt ${attempt}: ${status}"
              case "${status}" in
                Accepted)
                  break
                  ;;
                Invalid|Rejected)
                  xcrun notarytool log "${submission_id}" "${notary_auth[@]}" || true
                  exit 1
                  ;;
              esac
            else
              echo "notarytool info failed on attempt ${attempt}; retrying"
            fi
            sleep 20
          done

          if [[ "${status}" != "Accepted" ]]; then
            echo "::error::Notary submission ${submission_id} did not reach Accepted status"
            exit 1
          fi

          xcrun stapler staple "${PACKAGE_PATH}"
          xcrun stapler validate "${PACKAGE_PATH}"
          spctl -a -vv --type install "${PACKAGE_PATH}"

      - name: Create checksums and release notes
        run: |
          set -euo pipefail
          package_directory="$(dirname "${PACKAGE_PATH}")"
          package_basename="$(basename "${PACKAGE_PATH}")"
          (
            cd "${package_directory}"
            shasum -a 256 "${package_basename}" > "${package_basename}.sha256"
            shasum -a 256 --check "${package_basename}.sha256"
          )
          package_sha256="$(shasum -a 256 "${PACKAGE_PATH}" | awk '{print $1}')"
          notarization_status="stapled"
          if [[ "${SKIP_NOTARIZATION}" == "true" ]]; then
            notarization_status="skipped"
          fi
          required_capabilities="${REQUIRED_GUEST_CAPABILITIES}"

          if [[ "${PREPARE_UNPAIRED_DRAFT}" == "true" ]]; then
            cat > release-notes.md <<EOF
          Package-only staging draft for rebuilding the paired macOS sandbox image. Do not deploy this draft.

          - Container commit: ${CONTAINER_COMMIT}
          - Kubernetes baseline: ${KUBERNETES_BASELINE}
          - Package: ${PACKAGE_NAME}
          - Package SHA-256: ${package_sha256}
          - Package guest-agent SHA-256: ${PACKAGE_GUEST_AGENT_SHA256}
          - Signing: Developer ID Application and Developer ID Installer
          - Notarization: ${notarization_status}
          - Formal release metadata and attestations will be generated only after sandbox pairing succeeds.
          EOF
          else
            jq -n \
              --arg release_tag "${RELEASE_TAG}" \
              --arg container_commit "${CONTAINER_COMMIT}" \
              --arg kubernetes_baseline "${KUBERNETES_BASELINE}" \
              --arg package_name "${PACKAGE_NAME}" \
              --arg package_version "${PACKAGE_VERSION}" \
              --arg package_sha256 "${package_sha256}" \
              --arg kubelet_artifact "${KUBELET_ARTIFACT_URL}" \
              --arg kubelet_artifact_sha256 "${KUBELET_ARTIFACT_SHA256}" \
              --arg guest_agent_sha256 "${PACKAGE_GUEST_AGENT_SHA256}" \
              --arg deployment_pairing_sha256 "${DEPLOYMENT_PAIRING_SHA256}" \
              --argjson required_capabilities "$(jq -c '.guestAgent.requiredCapabilities' "${RELEASE_POLICY_PATH}")" \
              --arg notarization "${notarization_status}" \
              '{
                schemaVersion: 2,
                releaseTag: $release_tag,
                containerCommit: $container_commit,
                kubernetesBaseline: $kubernetes_baseline,
                package: {
                  name: $package_name,
                  version: $package_version,
                  sha256: $package_sha256,
                  guestAgentSHA256: $guest_agent_sha256,
                  signing: "Developer ID Application and Developer ID Installer",
                  notarization: $notarization,
                  kubeletArtifact: $kubelet_artifact,
                  kubeletArtifactSHA256: $kubelet_artifact_sha256
                },
                guestAgent: {
                  requiredCapabilities: $required_capabilities
                },
                deploymentPairing: {
                  required: true,
                  digestAlgorithm: "sha256",
                  manifestSHA256: $deployment_pairing_sha256
                },
                verificationPolicy: {
                  digestPinningRequired: true,
                  packageGuestAgentMustMatchSandbox: true,
                  privateDeploymentPairingRequired: true,
                  releasePredicateType: "https://in-toto.io/attestation/release/v0.1"
                }
              }' > "${RELEASE_MANIFEST_PATH}"

            jq -n \
              --arg purl "pkg:generic/container-macos-node@${PACKAGE_VERSION}" \
              --arg package_id "container-macos-node" \
              '{purl: $purl, packageId: $package_id}' > "${PACKAGE_RELEASE_PREDICATE_PATH}"

            cat > release-notes.md <<EOF
          macOS Kubernetes worker-node installer.

          - Container commit: ${CONTAINER_COMMIT}
          - Kubernetes baseline: ${KUBERNETES_BASELINE}
          - Kubelet artifact: ${KUBELET_ARTIFACT_URL}
          - Kubelet artifact SHA-256: ${KUBELET_ARTIFACT_SHA256}
          - Node template name: ${MACOS_NODE_NAME}
          - Package: ${PACKAGE_NAME}
          - Package SHA-256: ${package_sha256}
          - Signing: Developer ID Application and Developer ID Installer
          - Notarization: ${notarization_status}
          - Package and sandbox guest-agent SHA-256: ${PACKAGE_GUEST_AGENT_SHA256}
          - Required guest capabilities: ${required_capabilities}
          - Private deployment pairing manifest SHA-256: ${DEPLOYMENT_PAIRING_SHA256}
          - Attested release metadata: $(basename "${RELEASE_MANIFEST_PATH}")
          EOF
          fi

      - name: Prepare package SBOM root
        if: env.PREPARE_UNPAIRED_DRAFT != 'true'
        run: |
          set -euo pipefail
          rm -rf "${PACKAGE_SBOM_ROOT}"
          mkdir -p "${PACKAGE_SBOM_ROOT}"
          pkgutil --expand-full "${PACKAGE_PATH}" "${PACKAGE_SBOM_ROOT}/pkg"

      - name: Generate package SBOM
        if: env.PREPARE_UNPAIRED_DRAFT != 'true'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ env.PACKAGE_SBOM_ROOT }}/pkg/Payload
          format: spdx-json
          output-file: ${{ env.PACKAGE_SBOM_PATH }}
          upload-artifact: false
          upload-release-assets: false

      - name: Attest package release
        if: env.PREPARE_UNPAIRED_DRAFT != 'true'
        id: package_release_attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ env.PACKAGE_PATH }}
          predicate-type: https://in-toto.io/attestation/release/v0.1
          predicate-path: ${{ env.PACKAGE_RELEASE_PREDICATE_PATH }}

      - name: Attest package SBOM
        if: env.PREPARE_UNPAIRED_DRAFT != 'true'
        id: package_sbom_attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ env.PACKAGE_PATH }}
          sbom-path: ${{ env.PACKAGE_SBOM_PATH }}

      - name: Attest release manifest
        if: env.PREPARE_UNPAIRED_DRAFT != 'true'
        id: release_manifest_attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ env.RELEASE_MANIFEST_PATH }}

      - name: Collect attestation bundles
        if: env.PREPARE_UNPAIRED_DRAFT != 'true'
        run: |
          set -euo pipefail
          cp '${{ steps.package_release_attestation.outputs.bundle-path }}' "${PACKAGE_RELEASE_ATTESTATION_PATH}"
          cp '${{ steps.package_sbom_attestation.outputs.bundle-path }}' "${PACKAGE_SBOM_ATTESTATION_PATH}"
          cp '${{ steps.release_manifest_attestation.outputs.bundle-path }}' "${RELEASE_MANIFEST_ATTESTATION_PATH}"

      - name: Upload workflow artifacts
        if: env.PREPARE_UNPAIRED_DRAFT != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: container-macos-node-installer
          path: |
            ${{ env.PACKAGE_PATH }}
            ${{ env.PACKAGE_PATH }}.sha256
            ${{ env.RELEASE_MANIFEST_PATH }}
            ${{ env.PACKAGE_SBOM_PATH }}
            ${{ env.PACKAGE_RELEASE_ATTESTATION_PATH }}
            ${{ env.PACKAGE_SBOM_ATTESTATION_PATH }}
            ${{ env.RELEASE_MANIFEST_ATTESTATION_PATH }}

      - name: Publish GitHub release
        env:
          # Old-target draft promotion requires Contents and Workflows write permissions.
          GH_TOKEN: ${{ secrets.MACOS_NODE_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail

          metadata_assets=(
            "${RELEASE_MANIFEST_PATH}"
            "${PACKAGE_SBOM_PATH}"
            "${PACKAGE_RELEASE_ATTESTATION_PATH}"
            "${PACKAGE_SBOM_ATTESTATION_PATH}"
            "${RELEASE_MANIFEST_ATTESTATION_PATH}"
          )

          if [[ "${PROMOTE_EXISTING_DRAFT}" == "true" ]]; then
            gh release upload "${RELEASE_TAG}" \
              "${metadata_assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${CONTAINER_COMMIT}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md \
              --draft=false \
              --prerelease=false
          elif [[ "${PREPARE_UNPAIRED_DRAFT}" == "true" ]]; then
            gh release create "${RELEASE_TAG}" \
              "${PACKAGE_PATH}" \
              "${PACKAGE_PATH}.sha256" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${CONTAINER_COMMIT}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md \
              --draft
          else
            release_args=(
              gh release create "${RELEASE_TAG}"
              "${PACKAGE_PATH}"
              "${PACKAGE_PATH}.sha256"
              "${metadata_assets[@]}"
              --repo "${GITHUB_REPOSITORY}"
              --target "${CONTAINER_COMMIT}"
              --title "${RELEASE_TAG}"
              --notes-file release-notes.md
            )

            if [[ "${RELEASE_DRAFT}" == "true" ]]; then
              release_args+=(--draft)
            fi
            if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
              release_args+=(--prerelease)
            fi

            if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "::error::Release ${RELEASE_TAG} already exists; refusing to replace published assets"
              exit 1
            fi
            "${release_args[@]}"
          fi

      - name: Verify published GitHub release
        if: env.RELEASE_DRAFT != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_json="$(gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,isPrerelease,targetCommitish,assets)"
          package_sha256="$(shasum -a 256 "${PACKAGE_PATH}" | awk '{print $1}')"
          jq -e \
            --arg container_commit "${CONTAINER_COMMIT}" \
            --argjson prerelease "${RELEASE_PRERELEASE}" \
            --arg package_name "${PACKAGE_NAME}" \
            --arg package_digest "sha256:${package_sha256}" \
            --arg checksum_name "${PACKAGE_NAME}.sha256" \
            --arg release_manifest_name "$(basename "${RELEASE_MANIFEST_PATH}")" \
            --arg sbom_name "$(basename "${PACKAGE_SBOM_PATH}")" \
            --arg package_attestation_name "$(basename "${PACKAGE_RELEASE_ATTESTATION_PATH}")" \
            --arg package_sbom_attestation_name "$(basename "${PACKAGE_SBOM_ATTESTATION_PATH}")" \
            --arg release_manifest_attestation_name "$(basename "${RELEASE_MANIFEST_ATTESTATION_PATH}")" \
            '.isDraft == false
              and .isPrerelease == $prerelease
              and .targetCommitish == $container_commit
              and ([.assets[] | select(.name == $package_name and .digest == $package_digest)] | length) == 1
              and ([.assets[] | select(.name == $checksum_name)] | length) == 1
              and ([.assets[] | select(.name == $release_manifest_name)] | length) == 1
              and ([.assets[] | select(.name == $sbom_name)] | length) == 1
              and ([.assets[] | select(.name == $package_attestation_name)] | length) == 1
              and ([.assets[] | select(.name == $package_sbom_attestation_name)] | length) == 1
              and ([.assets[] | select(.name == $release_manifest_attestation_name)] | length) == 1' \
            <<< "${release_json}" >/dev/null

          remote_tag_commit="$(git ls-remote --refs origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
          if [[ "${remote_tag_commit}" != "${CONTAINER_COMMIT}" ]]; then
            echo "::error::Remote tag ${RELEASE_TAG} points to ${remote_tag_commit}, expected ${CONTAINER_COMMIT}"
            exit 1
          fi

      - name: Remove private release pairing
        if: always()
        run: rm -f "${RELEASE_PAIRING_PATH:-${RUNNER_TEMP}/release-pairing.json}"
